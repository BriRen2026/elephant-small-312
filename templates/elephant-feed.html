		<script type="text/javascript" charset="utf-8">
			const socket = io();

			function sendComment(postNumber) {
				const parent = document.getElementById(postNumber);
				let idContainer = parent.querySelector("#post_id");
				let commentContainer = parent.querySelector("#form-comment-message");

				let username = document.getElementById("header-user").textContent;
				let postID = idContainer.value;
				let comment = commentContainer.value;
				console.log("Comment length: ",comment.length);
				// Only post the comment if they didn't say nothing
				if (comment && comment.trim()){

					console.log("User " + username + " commented: " + comment);

					let commentData = {"username": username, "post_id": postID, "comment": comment};

					// socket.connect();

					// Sends data in real time to 'commentData' socket route in app.py
					socket.emit('commentData', JSON.stringify(commentData));
				}
			}

			socket.on("feed", function(newComment) {
				newComment = JSON.parse(newComment);

				// Identifies post by the correct hashedID (same for every user)
				let postID = newComment["postID"];
				let postTag = "elephant-post." + postID;

				// console.log(feedHTML);
				// console.log("Posts: " + posts);

				// Updates/sets the HTML of the elephant feed live
				// This collapses because it doesn't preserve that the description was open

				// FIXED: only updates the comments section of the post that was commented on
				if (document.getElementById(postTag)) {
					let parent = document.getElementById(postTag);
					let comments = parent.querySelector("#comments");

					comments.innerHTML += newComment["comment"];
				}
			});
