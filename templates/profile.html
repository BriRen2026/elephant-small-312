<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Elephant Site</title>
    <link rel="stylesheet" href="/static/css/profile.css">
	<link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">  </head>

<body style="background-color: #d5eaed;">

  <header id="white-bg" role="banner">
	<div class="container py-2 px-5 d-flex flex-row justify-content-between">
		<div class="fs-5">
			<span class="align-middle">
			<img src="/static/images/elephant-small.jpg" id="elephantsmalllogo" alt="Elephant Small Site Logo" style="cursor: pointer" onclick="elephantSound()">
			<a href="/"><h1 class="fs-5 align-middle">Elephant Fashion Brawl</h1></a>
			</span>
		</div>
		<div class="text-end">
			<a href="/elephant-feed">
			<span class="align-middle" id="viewElephants">View Posted Elephants</span>
				<span class="fa-solid fa-bars align-middle px-1"></span>
			</a>
			<a href="/elephant-maker">
				<span class="material-symbols-outlined align-middle px-2">checkroom</span>
			</a>
			<span id="header-user">{username}</span>
			<a href="/profile"><img class="rounded-5" src="{{pfp}}" style="width: 40px; height: 40px;" alt="Your Profile Picture"></a>
			<a class="align-middle" href="/logout">Logout</a>
	</div>
  </header>

		<div class="container pt-md-5 mt-3 mx-auto" style="width: 75%">
			<div class="row text-center gy-3 align-items-center">

				<div class="col-md-12 p-3 mx-auto text-start" id="white-bg" style="border: 8px solid pink;">
					<div class="d-flex align-items-center mb-2">
						<img class="rounded-circle" src="{{pfp}}" style="width: 80px; height: 80px;">
						<div class="vertical-align ps-2">{username}</div>
					</div>
					<form action="/change-pfp" method="post" enctype="multipart/form-data" id="change-pfp-form">
						<label for="pfp">Select Profile Picture (5MB):</label></br>

						<div class="d-flex align-items-center">
							<input type="submit" value="Submit"  class="m-0"/>
							<input class="ps-1" type="file" id="pfp" name="pfp" accept="image/png, image/jpeg, image/gif"/></br>
						</div>
					</form>
				</div>

			</div>
		</div>

	<footer class = "navbar fixed-bottom" style="background-color: white;">
		<div class="container">
			<span>Support | Contact</span>
			<span><a href="https://www.instagram.com/elephant_small.jpg?igsh=MXYxNWJndmE1ZGljcw==">Instagram <i class="fa-brands fa-instagram"></i></a> |
			<a href="#">Discord <i class="fa-brands fa-discord"></i></a></span>
		</div>
	</footer>
  <script src="/static/javascript/function.js"></script>
  </body>

</html>
