<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Elephant Site</title>
    <link rel="stylesheet" href="/static/css/home.css">
	<link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">  </head>

<body style="background-color: #d5eaed;">

  <header id="white-bg" role="banner">
	<div class="container py-2 px-5 d-flex justify-content-between">
		<div class="fs-5">
			<span class="align-middle">
			<img src="/static/images/elephant-small.jpg" id="elephantsmalllogo" alt="Elephant Small Site Logo" style="cursor: pointer" onclick="elephantSound()">
			<a href="/"><h1 class="fs-5 align-middle">Elephant Fashion Brawl</h1></a>
			</span>
		</div>
		<div class="text-end">
			<a href="/register">
			<span class="align-middle" id="viewElephants">View Posted Elephants</span>
				<span class="fa-solid fa-bars align-middle px-1"></span>
			</a>
			<a class="btn text-white fw-semibold rounded-3" href="/register" id="register-link" role="button">Register</a>
			<a class="align-middle" href="/login">Login</a>
		</div>
	</div>
  </header>

  <!--Padding stops body content being hidden behind navbar + footer-->
	<div class="container pt-md-5 mt-5 mx-auto" style="width: 75%;">

			<div class="row text-center gy-3 align-items-center">
				<div class="col-md-6 p-0 mx-auto" id="white-bg">
					<div class="card text-center border-0">
						<div class="card-header border-0 p-1 fs-5" id="pink-bg">
							<h2 class="fs-6">Create an Account</h2>
						</div>
						<div class="card-body px-0 text-start" style="margin: 0 auto; width: 50%;">

								<form action="/registerForm" method="post" enctype="application/x-www-form-urlencoded">
									<label style="width: 100%;">Username:<br>
									<input id="userregister" maxlength="30" type="text" name="username" placeholder="username" value=""/>
									</label>

									<label style="width: 100%;">Password:&nbsp;<br>
									<input id="passregister" type="password" name="password" placeholder="password" maxlength="30" />
									</label>

									<label style="width: 100%;">Reenter Password:&nbsp;<br>
									<input id="repassregister" type="password" name="repassword" placeholder="password" maxlength="30" />
									</label><br>

									<input class="mt-2" id="submit-button" type="submit" onclick="sendCredentials()" value="Sign Up" >
							   </form>

						</div>
						<div class="card-text pb-3">
							 Already Have an Account? <a href="/login" id="style-link">Login</a>
						</div>
					</div>
				</div>
			</div>

	</div>
  </body>

	<footer class = "navbar fixed-bottom" style="background-color: white;">
		<div class="container">
			<span>Support | Contact</span>
			<span><a id="unstyle-link" href="https://www.instagram.com/elephant_small.jpg?igsh=MXYxNWJndmE1ZGljcw==">Instagram <i class="fa-brands fa-instagram"></i></a> |
			<a id="unstyle-link" href="#">Discord <i class="fa-brands fa-discord"></i></a></span>
		</div>
	</footer>
  <script src="/static/javascript/function.js"></script>
  </body>
</html>
